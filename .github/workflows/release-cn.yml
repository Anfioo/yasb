name: Build & Release (CN)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.14'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            python_arch: x64
    name: Build (${{ matrix.arch }})

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        architecture: ${{ matrix.python_arch }}

    - name: Create virtual environment
      run: |
        python -m venv venv
      shell: pwsh

    - name: Activate virtual environment and install dependencies
      run: |
        .\venv\Scripts\Activate
        python -m pip install --upgrade pip
        pip install --force --no-cache .[packaging]
      shell: pwsh

    - name: Build EXE
      run: |
        .\venv\Scripts\Activate
        cd src
        python build.py build
      shell: pwsh

    - name: Build MSI
      run: |
        .\venv\Scripts\Activate
        cd src
        python build.py bdist_msi
      shell: pwsh

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: yasb-cn-build
        path: |
          src/dist/yasb.exe
          src/dist/yasbc.exe
          src/dist/yasb_themes.exe
          src/dist/yasb_cloud.exe
          src/dist/out/*.msi

    - name: Determine Release Tag
      id: tag
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $tag = "${{ github.event.inputs.version }}"
        } else {
          $tag = "${{ github.ref_name }}"
        }
        Write-Host "Release tag: $tag"
        echo "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Generate Checksum
      run: |
        .\venv\Scripts\Activate
        $files = @()
        $exePatterns = @('src/dist/yasb.exe', 'src/dist/yasbc.exe', 'src/dist/yasb_themes.exe', 'src/dist/yasb_cloud.exe')
        foreach ($p in $exePatterns) {
          if (Test-Path $p) { $files += Get-Item $p }
        }
        $msi = Get-ChildItem -Path 'src/dist/out' -Filter '*.msi' -ErrorAction SilentlyContinue
        if ($msi) { $files += $msi }
        $output = @()
        foreach ($f in $files) {
          $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
          $output += "$hash  $($f.Name)"
        }
        $output -join "`n" | Set-Content -Path 'src/dist/checksums.txt' -Encoding utf8
      shell: pwsh

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: ${{ steps.tag.outputs.tag }}
        body: |
          YASB 中文汉化版（yasb-cn 分支）构建产物。

          ## 安装说明
          - 下载与你的系统架构匹配的 .msi 安装包，双击安装即可。
          - 也可以直接运行 yasb.exe（便携版，需自行安装运行依赖）。
          - 校验文件 checksums.txt 为 SHA256 校验和。

          ## 说明
          本版本基于 yasb main 分支（1d52ba35）进行界面汉化，覆盖任务栏、托盘、组件菜单、快速启动、YASB Cloud 等全部用户可见界面文案。
        files: |
          src/dist/checksums.txt
          src/dist/yasb.exe
          src/dist/yasbc.exe
          src/dist/yasb_themes.exe
          src/dist/yasb_cloud.exe
          src/dist/out/*.msi
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
